name: Build, test and publish APT

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libncurses-dev dpkg-dev apt-utils python3-pyte openssh-server openssh-client sudo curl procps strace
      - name: Build Debian package and run unit tests
        run: |
          version=$(sed -n 's/^project(4agent VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          bash scripts/build-deb.sh "$GITHUB_WORKSPACE/build-deb" "$version-${{ github.run_number }}"
      - name: Install package and run account, SSH and terminal tests
        run: |
          sudo apt-get install -y ./build-deb/*.deb
          sudo du -sh /etc/skel
          sudo strace -tt -f -e trace=process,flock,fcntl,fsync,clock_nanosleep,connect,poll,openat,mkdir -o /tmp/4agent-process.trace bash tests/integration.sh /usr/sbin/4agent || {
            sudo tail -n 160 /tmp/4agent-process.trace
            sudo systemctl status 4agent-expire.timer 4agent-expire.service --no-pager || true
            exit 1
          }
          sudo python3 tests/tui_tests.py /usr/sbin/4agent
      - name: Build APT repository
        run: bash scripts/build-apt-repo.sh site build-deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: build-deb/*.deb
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build-deb/*.deb --generate-notes
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy APT repository
        id: deployment
        uses: actions/deploy-pages@v4
